<!DOCTYPE html>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f3f4f6;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Header ── */
    #header {
      flex-shrink: 0;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 14px 24px;
      display: flex;
      align-items: baseline;
      gap: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
      z-index: 1000;
    }
    #header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #111827;
      letter-spacing: -.3px;
    }
    #header p {
      font-size: .85rem;
      color: #6b7280;
      font-weight: 400;
    }

    /* ── Map container ── */
    #map {
      flex: 1;
      width: 100%;
    }

    /* ── Legend ── */
    .legend {
      background: rgba(255,255,255,.95);
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 12px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.10);
      font-size: .82rem;
      color: #374151;
      min-width: 195px;
      backdrop-filter: blur(4px);
    }
    .legend h4 {
      font-size: .78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: #6b7280;
      margin-bottom: 9px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 7px;
    }
    .legend-item:last-child { margin-bottom: 0; }
    .legend-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 1.5px solid rgba(0,0,0,.15);
    }
    .dot-medium  { background: #2563eb; }
    .dot-large   { background: #9ca3af; }
    .dot-selected{ background: #ef4444; }

    /* ── Popup tweaks ── */
    .leaflet-popup-content-wrapper {
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0,0,0,.15);
      border: 1px solid #e5e7eb;
    }
    .leaflet-popup-content {
      margin: 10px 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .popup-name {
      font-size: .95rem;
      font-weight: 700;
      color: #111827;
    }
    .popup-pop {
      font-size: .82rem;
      color: #6b7280;
      margin-top: 3px;
    }

    /* ── Tooltip (city labels) ── */
    .leaflet-tooltip.city-label {
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0;
      font-size: .72rem;
      font-weight: 600;
      color: #1d4ed8;
      white-space: nowrap;
      pointer-events: none;
      text-shadow: 0 1px 3px #fff, 0 -1px 3px #fff, 1px 0 3px #fff, -1px 0 3px #fff;
    }
    .leaflet-tooltip.city-label::before { display: none; }

    /* Department boundary GeoJSON layer */
    .dept-boundary {
      transition: opacity .2s;
    }
  </style>
</head>

//  Map initialisation

  center: [46.5, 2.5],
  zoom: 6,
  minZoom: 5,
  maxZoom: 14,
  zoomControl: true,
});

// CartoDB Positron basemap
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 19,
}).addTo(map);

// ─────────────────────────────────────────────
//  Department boundaries GeoJSON
// ─────────────────────────────────────────────
fetch('https://raw.githubusercontent.com/gregoiredavid/france-geojson/master/departements-version-simplifiee.geojson')
  .then(r => r.json())
  .then(data => {
    L.geoJSON(data, {
      className: 'dept-boundary',
      style: {
        color: '#374151',
        weight: 1,
        fillOpacity: 0,
        opacity: 0.6,
      },
      interactive: false,
    }).addTo(map);
  })
  .catch(() => console.warn('Impossible de charger les frontières des départements.'));

// De-duplicate cities (same name can appear twice in the data)
const seen = new Set();
const uniqueCities = CITIES.filter(c => {
  if (seen.has(c.name)) return false;
  seen.add(c.name);
  return true;
});

// Reset a previously selected marker
function resetSelected() {
  if (selectedMarker && selectedOrigStyle) {
    selectedMarker.setStyle(selectedOrigStyle);
    selectedMarker.closePopup();
    selectedMarker = null;
    selectedOrigStyle = null;
  }
}

// Click on map background → deselect
map.on('click', resetSelected);

uniqueCities.forEach(city => {
  const isMedium = city.pop >= MEDIUM_MIN && city.pop < MEDIUM_MAX;
  const isLarge  = city.pop >= MEDIUM_MAX;

  // Skip cities below 20k
  if (city.pop < MEDIUM_MIN) return;

  const baseStyle = isMedium ? { ...STYLE_MEDIUM } : { ...STYLE_LARGE };

  const marker = L.circleMarker([city.lat, city.lng], { ...baseStyle, interactive: true });

  // Persistent label for medium cities only
  if (isMedium) {
    marker.bindTooltip(city.name, {
      permanent: true,
      direction: 'right',
      offset: [8, 0],
      className: 'city-label',
    });
  }

  // Popup (shown on click)
  const popupContent = `
    <div class="popup-name">${city.name}</div>
    <div class="popup-pop">${formatPop(city.pop)}</div>
  `;
  marker.bindPopup(popupContent, { closeButton: false, offset: [0, -4] });

  marker.on('click', function (e) {
    L.DomEvent.stopPropagation(e); // prevent map click from firing

    if (selectedMarker === marker) {
      // Toggle off
      resetSelected();
      return;
    }

    // Deselect previous
    resetSelected();

    // Select this one
    selectedOrigStyle = { ...baseStyle };
    marker.setStyle(STYLE_SELECTED);
    marker.openPopup();
    selectedMarker = marker;
  });

  marker.addTo(map);
});

// ─────────────────────────────────────────────
//  Legend
// ─────────────────────────────────────────────
const legend = L.control({ position: 'bottomright' });
legend.onAdd = function () {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = `
    <h4>Légende</h4>
    <div class="legend-item">
      <span class="legend-dot dot-medium"></span>
      <span>Ville moyenne (20k – 100k)</span>
    </div>
    <div class="legend-item">
      <span class="legend-dot dot-large"></span>
      <span>Grande ville (&gt; 100k)</span>
    </div>
    <div class="legend-item">
      <span class="legend-dot dot-selected"></span>
      <span>Ville sélectionnée</span>
    </div>
  `;
  L.DomEvent.disableClickPropagation(div);
  return div;
};
legend.addTo(map);
</script>
</body>
</html>
